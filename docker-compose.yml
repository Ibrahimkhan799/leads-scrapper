services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadintel
      POSTGRES_PASSWORD: leadintel
      POSTGRES_DB: leadintel
    ports:
      - "5432:5432"
    volumes:
      - leadintel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadintel -d leadintel"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  leadintel_pg:
