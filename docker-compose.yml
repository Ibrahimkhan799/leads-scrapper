services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadintel
      POSTGRES_PASSWORD: leadintel
      POSTGRES_DB: leadintel
    ports:
      - "5432:5432"
    volumes:
      - leadintel_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  leadintel_pg:
